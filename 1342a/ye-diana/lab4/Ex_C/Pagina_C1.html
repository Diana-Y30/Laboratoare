<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

  #hd {
        font-variant: small-caps;
        color:magenta;
    }
  h1, caption {
        color: blue;
    background-color: #cccc00;
    }
  body {
    background-color: #ffffcc;
    }
  .center, p {
  text-align: center;
  color: red;
  }

  table{
    border-collapse: collapse;
    padding: 10px 10px ;
  }

  th{
    background-color: magenta;
    border: 2px solid green;
  }

  td{
    background-color: orange;
    border: 2px solid green;
  }

  #magenta_cell{
    background-color: magenta;
    text-align: center;
  }

  caption{
    color: white;
    font-size: large;
    background-color: orange;
  }

</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"
</p> 
<table style="width:100%">
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
	  <th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
	<td id="magenta_cell" rowspan="3">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
   <tr>
    <td>Ion</td>
    <td>istorie</td>
    <td>geografie</td>
  </tr>


  <tr>
	<td id="magenta_cell" rowspan="4">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
	
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
	
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Ana</td>
    <td>literatura</td>
    <td>poezie</td>
  </tr>
</table>
</body>
</html>
